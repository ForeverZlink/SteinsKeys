[package]
name = "steins-keys"
version = "1.0.48"
description = "Zero-lag Mouse Axis Inverter, Remapper & Low-Latency Audio Customizer"
authors = ["Future Gadget Lab"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-shell = "2.0.0"

# Serialização & Estado
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"

# Concorrência Lock-Free (Zero-Jitter no Hot Path de 8000Hz)
arc-swap = "1.7"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Áudio de Baixa Latência (WASAPI via cpal/kira)
kira = { version = "0.9", default-features = false, features = ["cpal", "wav", "ogg"] }

# APIs Nativas do Windows (Win32 Hooks, Threads, Processos e Raw Input)
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
]

# Suporte Opcional ao Driver de Kernel Interception (Modo FPS Raw Input)
[features]
default = ["user-hook"]
user-hook = []
kernel-interception = ["dep:interception"]

[dependencies.interception]
version = "0.1"
optional = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
